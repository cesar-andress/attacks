# Allowlisted unresolved markers for release-critical public files.
# Markers not listed here (matching scan patterns) fail validate_todos.
# status: intentional | blocked | resolved_documented
# resolution_condition: required for blocked items

version: 1
updated: 2026-07-31

# Patterns that are NEVER allowlisted in release-critical prose (fake IDs / dummy URLs)
forbidden_patterns:
  - 'preregistration.?id.?=.?(TBD|TODO|XXX|0000)'
  - 'https?://example\.(com|org)'
  - 'doi\.org/10\.0000/'
  - 'INSERT_PREREG'
  - 'FAKE_OSF'

# Legitimate scientific uses of "pending"/"provisional" are not banned globally.
# Only explicit TODO/FIXME/CITATION-NEEDED/XXX markers and registered stubs are scanned.

