# Files where registered intentional scientific language is expected
release_critical_globs:
  - docs/**/*.md
  - data/**/*.csv
  - data/**/*.txt
  - experiments/**/*.md
  - experiments/**/*.csv
  - CITATION.cff
  - README.md
  - src/**/*.py
  - tests/**/*.py

# Exclude from TODO marker failure (generated, local, binary)
exclude_globs:
  - docs/todo/**
  - '**/__pycache__/**'
  - experiments/_generated/**
  - local_sources/**
  - data/sources/**
  - .venv/**
