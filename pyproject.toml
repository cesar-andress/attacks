[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-security-audit"
version = "0.3.1"
description = "Reproducible infrastructure for a documentary content analysis of school-security frameworks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "César Andrés" }]
keywords = [
  "content-analysis",
  "school-security",
  "open-science",
  "reproducibility",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ssa-validate-metadata = "school_security_audit.cli:validate_metadata_main"
ssa-validate-coding = "school_security_audit.cli:validate_coding_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
